name: macOS CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set bundle version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
            version="${BASH_REMATCH[1]}"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare Geisha toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xz >/dev/null 2>&1 || brew install xz
          git clone --depth 1 https://github.com/geisha-lang/geisha.gsa.git "$RUNNER_TEMP/geisha.gsa"
          make -C "$RUNNER_TEMP/geisha.gsa" runtime stage2
          mkdir -p "$HOME/.geisha/bin" "$HOME/.geisha/lib"
          cp "$RUNNER_TEMP/geisha.gsa/build/geisha2" "$HOME/.geisha/bin/geisha"
          cp "$RUNNER_TEMP/geisha.gsa/build/libgeisha_runtime.a" "$HOME/.geisha/lib/libgeisha_runtime.a"
          echo "$HOME/.geisha/bin" >> "$GITHUB_PATH"
          "$HOME/.geisha/bin/geisha" --version || true
      - name: Build and test
        run: make all test status-cleanup-test man-lint app CODESIGN_IDENTITY=-
      - name: Package and verify archive
        run: |
          make dist
          mkdir -p artifacts
          cp build/Talus-macos.zip artifacts/Talus-macos-arm64.zip
          ditto -x -k artifacts/Talus-macos-arm64.zip "$RUNNER_TEMP/package-check"
          app="$RUNNER_TEMP/package-check/Talus.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Talus")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$APP_VERSION"
          cd artifacts
          shasum -a 256 Talus-macos-arm64.zip > Talus-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Talus-macos-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Talus-macos-arm64
          path: artifacts
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Apple Silicon (arm64) build. Extract the ZIP and move Talus.app to /Applications.

          Grant Accessibility permission on first launch. This experimental build is ad-hoc signed and is not notarized by Apple; macOS Gatekeeper may require explicit approval.

          The SHA-256 checksum is attached alongside the ZIP.
          NOTES
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag \
            --title "Talus $RELEASE_TAG" --generate-notes --notes-file release-notes.md
