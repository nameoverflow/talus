<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Talus — Tiling window manager for macOS.">
  <title>Talus — Tiling window manager for macOS.</title>
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#EAEFE9"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="74%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#AFCBC2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F8F6F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="masterL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#294050"/>
      <stop offset="100%" stop-color="#172631"/>
    </linearGradient>
    <linearGradient id="stackTopL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4EE"/>
    </linearGradient>
    <linearGradient id="stackBotL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EEE8"/>
      <stop offset="100%" stop-color="#C3DBD2"/>
    </linearGradient>
    <filter id="cardShadowBackL" x="-16%" y="-16%" width="136%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172631" flood-opacity="0.09"/>
    </filter>
    <filter id="cardShadowFrontL" x="-16%" y="-16%" width="136%" height="142%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#172631" flood-opacity="0.16"/>
    </filter>
    <clipPath id="clipLight">
      <rect width="1280" height="640" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipLight)">
    <!-- Calm Warm Limestone Canvas -->
    <rect width="1280" height="640" fill="url(#bgLight)"/>
    <rect width="1280" height="640" fill="url(#glowLight)"/>

    <!-- Left: Spacious Typographic Anchor -->
    <rect x="88" y="226" width="42" height="4.5" rx="2.25" fill="#D37859"/>
    <text x="86" y="334" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="96" font-weight="600" letter-spacing="-3.5" fill="#172631">Talus</text>
    <text x="90" y="386" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="23" font-weight="400" letter-spacing="-0.2" fill="#4A5F6C">Tiling window manager for macOS.</text>

    <!-- Right: Three Stacked Spaces, Each Showing a Distinct Layout -->

    <!-- SPACE 3 (Back): Full Layout -->
    <g transform="translate(800, 72)" filter="url(#cardShadowBackL)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#E3EAE6" stroke="#172631" stroke-opacity="0.10" stroke-width="1.2"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#6F828E">03 · FULL</text>
      <rect x="16" y="36" width="368" height="208" rx="13" fill="#D2DFD9" stroke="#172631" stroke-opacity="0.07" stroke-width="1"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#31495C" fill-opacity="0.35"/>
    </g>

    <!-- SPACE 2 (Middle): Mirror Tall Layout -->
    <g transform="translate(684, 184)" filter="url(#cardShadowBackL)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#EFF3F0" stroke="#172631" stroke-opacity="0.13" stroke-width="1.2"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#596E7B">02 · MIRROR</text>
      <rect x="16" y="36" width="368" height="106" rx="13" fill="#DAE5E0" stroke="#172631" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#31495C" fill-opacity="0.55"/>
      <rect x="16" y="154" width="115" height="90" rx="12" fill="#E6EEE9" stroke="#172631" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="143" y="154" width="114" height="90" rx="12" fill="#E2EBE6" stroke="#172631" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="269" y="154" width="115" height="90" rx="12" fill="#DCE7E1" stroke="#172631" stroke-opacity="0.08" stroke-width="1"/>
    </g>

    <!-- SPACE 1 (Front, Active): Tall Layout -->
    <g transform="translate(556, 296)" filter="url(#cardShadowFrontL)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#FAF9F5" stroke="#172631" stroke-opacity="0.16" stroke-width="1.4"/>
      <circle cx="24" cy="20" r="3.5" fill="#D37859"/>
      <text x="36" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#172631">01 · TALL</text>
      <!-- Left Master Pane (Deep Slate + Terracotta Focus Bar) -->
      <rect x="16" y="36" width="208" height="208" rx="13" fill="url(#masterL)"/>
      <rect x="34" y="54" width="46" height="8" rx="4" fill="#D37859"/>
      <!-- Right Top Stack Pane -->
      <rect x="236" y="36" width="148" height="98" rx="13" fill="url(#stackTopL)" stroke="#172631" stroke-opacity="0.09" stroke-width="1"/>
      <!-- Right Bottom Stack Pane -->
      <rect x="236" y="146" width="148" height="98" rx="13" fill="url(#stackBotL)" stroke="#172631" stroke-opacity="0.09" stroke-width="1"/>
    </g>
  </g>
</svg>
