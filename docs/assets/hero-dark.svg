<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Talus — Windows, settled by geometry.">
  <title>Talus — Windows, settled by geometry.</title>
  <defs>
    <radialGradient id="terracottaGlow" cx="79%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#D37859" stop-opacity="0.17"/>
      <stop offset="55%" stop-color="#89CFC2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0E171E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E303E"/>
      <stop offset="100%" stop-color="#111C24"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="29.7%" y1="95.7%" x2="70.3%" y2="4.3%">
      <stop offset="0%" stop-color="#172631"/>
      <stop offset="100%" stop-color="#31495C"/>
    </linearGradient>
    <linearGradient id="tileM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F4E8"/>
      <stop offset="100%" stop-color="#DEE5DB"/>
    </linearGradient>
    <linearGradient id="tileT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F0E6"/>
      <stop offset="100%" stop-color="#CEDBD4"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6E6DD"/>
      <stop offset="100%" stop-color="#AFCBC2"/>
    </linearGradient>
    <filter id="stageShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <clipPath id="canvasClip">
      <rect width="1280" height="640" rx="12"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect x="58" y="58" width="908" height="908" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- Midnight Slate Canvas -->
    <rect width="1280" height="640" fill="#0E171E"/>
    <rect width="1280" height="640" fill="url(#terracottaGlow)"/>

    <!-- Subtle Architectural Tiling Hairlines (Right Background) -->
    <g stroke="#F7F5EE" stroke-opacity="0.055" stroke-width="1" fill="none">
      <rect x="794" y="48" width="438" height="544" rx="24"/>
      <line x1="1038" y1="48" x2="1038" y2="592"/>
      <line x1="1038" y1="320" x2="1232" y2="320"/>
      <rect x="822" y="76" width="382" height="488" rx="18" stroke-opacity="0.04"/>
    </g>

    <!-- Top Technical Pills -->
    <g transform="translate(72, 58)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#D37859" fill-opacity="0.16" stroke="#D37859" stroke-opacity="0.62" stroke-width="1"/>
      <text x="56" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11.5" font-weight="500" letter-spacing="0.9" fill="#F0A48A">TALUS v0.2</text>

      <rect x="126" y="0" width="150" height="28" rx="14" fill="#89CFC2" fill-opacity="0.09" stroke="#89CFC2" stroke-opacity="0.34" stroke-width="1"/>
      <text x="201" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11.5" letter-spacing="0.9" fill="#A6DDD3">100% PURE GEISHA</text>

      <rect x="290" y="0" width="146" height="28" rx="14" fill="#F7F5EE" fill-opacity="0.04" stroke="#F7F5EE" stroke-opacity="0.16" stroke-width="1"/>
      <text x="363" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11.5" letter-spacing="0.9" fill="#CBD5DC">MACOS 15+ · ARM64</text>

      <rect x="450" y="0" width="114" height="28" rx="14" fill="#F7F5EE" fill-opacity="0.04" stroke="#F7F5EE" stroke-opacity="0.16" stroke-width="1"/>
      <text x="507" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11.5" letter-spacing="0.9" fill="#CBD5DC">SIP INTACT</text>
    </g>

    <!-- Main Hero Typography -->
    <text x="72" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3.2" fill="#8FA3B1">TALUS · MACOS TILING WINDOW MANAGER</text>

    <text x="72" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-2.3" fill="#F7F5EE">Windows,</text>
    <text x="72" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-2.3" fill="#F7F5EE">settled by <tspan fill="#D37859">geometry.</tspan></text>

    <text x="72" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#AABAC5">
      <tspan x="72" dy="0" font-weight="600" fill="#F7F5EE">XMonad-inspired tiling, native to macOS—all the way down.</tspan>
      <tspan x="72" dy="29">Per-app Actor concurrency, virtual workspaces, xmobar-style status bar,</tspan>
      <tspan x="72" dy="27">and native AppKit Settings—zero Rust, zero Swift, zero SIP changes.</tspan>
    </text>

    <!-- Bottom Pipeline Strip -->
    <line x1="72" y1="540" x2="762" y2="540" stroke="#F7F5EE" stroke-opacity="0.12" stroke-width="1"/>
    <text x="72" y="574" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="12.5" fill="#8FA3B1">
      <tspan fill="#F7F5EE" font-weight="500">AX / SkyLight</tspan><tspan dx="14">&#8594;</tspan><tspan dx="14" fill="#F7F5EE" font-weight="500">ManagerCore</tspan> (pure)<tspan dx="14">&#8594;</tspan><tspan dx="14" fill="#F7F5EE" font-weight="500">Per-PID Actors</tspan><tspan dx="14">&#8594;</tspan><tspan dx="14" fill="#89CFC2" font-weight="500">AppKit</tspan>
    </text>

    <!-- Right Emblem Stage (Floating Talus App Mark) -->
    <g transform="translate(866, 134) scale(0.287109375)" filter="url(#stageShadow)">
      <rect x="58" y="58" width="908" height="908" rx="224" fill="url(#iconBg)"/>
      <g clip-path="url(#iconClip)">
        <polygon points="40,199 1000,-6 1000,249 40,454" fill="#FFFFFF" fill-opacity="0.045"/>
      </g>
      <rect x="58" y="58" width="908" height="908" rx="224" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>
      <rect x="169" y="184" width="686" height="656" rx="70" fill="#0A1924" fill-opacity="0.40"/>
      <rect x="191" y="207" width="374" height="610" rx="40" fill="url(#tileM)" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="2.5"/>
      <rect x="587" y="207" width="246" height="294" rx="40" fill="url(#tileT)" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="2.5"/>
      <rect x="587" y="523" width="246" height="294" rx="40" fill="url(#tileB)" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="2.5"/>
      <rect x="228" y="250" width="90" height="17" rx="8.5" fill="#D37859"/>
    </g>

    <!-- Mini Menu-Bar Status Pill Below Stage -->
    <g transform="translate(866, 480)">
      <rect x="0" y="0" width="294" height="32" rx="8" fill="#172631" stroke="#F7F5EE" stroke-opacity="0.14" stroke-width="1"/>
      <rect x="12" y="6" width="56" height="20" rx="5" fill="#89CFC2"/>
      <text x="40" y="20" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" font-weight="600" fill="#10201E">1 term</text>
      <text x="82" y="20" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" fill="#8FA3B1">2 web</text>
      <text x="130" y="20" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" fill="#8FA3B1">3 code</text>
      <text x="196" y="20" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" font-weight="600" fill="#D37859">Tall</text>
      <text x="282" y="20" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" fill="#CBD5DC">17:42</text>
    </g>
    <text x="1013" y="538" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="11" letter-spacing="1.1" fill="#8FA3B1">TALL · MIRROR · FULL · 1PX PARKING</text>
  </g>
</svg>
