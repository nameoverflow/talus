<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Talus — Tiling window manager for macOS.">
  <title>Talus — Tiling window manager for macOS.</title>
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D161D"/>
      <stop offset="100%" stop-color="#162530"/>
    </linearGradient>
    <radialGradient id="glowDark" cx="74%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#89CFC2" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#D37859" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#0D161D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="masterD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F4E8"/>
      <stop offset="100%" stop-color="#DEE5DB"/>
    </linearGradient>
    <linearGradient id="stackTopD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEEE5"/>
      <stop offset="100%" stop-color="#CEDBD4"/>
    </linearGradient>
    <linearGradient id="stackBotD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2E4DB"/>
      <stop offset="100%" stop-color="#A8C7BE"/>
    </linearGradient>
    <filter id="cardShadowBackD" x="-16%" y="-16%" width="136%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04080B" flood-opacity="0.42"/>
    </filter>
    <filter id="cardShadowFrontD" x="-16%" y="-16%" width="136%" height="142%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#04080B" flood-opacity="0.58"/>
    </filter>
    <clipPath id="clipDark">
      <rect width="1280" height="640" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipDark)">
    <!-- Calm Midnight Slate Canvas -->
    <rect width="1280" height="640" fill="url(#bgDark)"/>
    <rect width="1280" height="640" fill="url(#glowDark)"/>

    <!-- Left: Spacious Typographic Anchor -->
    <rect x="88" y="226" width="42" height="4.5" rx="2.25" fill="#D37859"/>
    <text x="86" y="334" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="96" font-weight="600" letter-spacing="-3.5" fill="#F7F5EE">Talus</text>
    <text x="90" y="386" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="23" font-weight="400" letter-spacing="-0.2" fill="#9BB0BE">Tiling window manager for macOS.</text>

    <!-- Right: Three Stacked Spaces, Each Showing a Distinct Layout -->

    <!-- SPACE 3 (Back): Full Layout -->
    <g transform="translate(800, 72)" filter="url(#cardShadowBackD)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#16242F" stroke="#F7F5EE" stroke-opacity="0.14" stroke-width="1.2"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#6F8696">03 · FULL</text>
      <rect x="16" y="36" width="368" height="208" rx="13" fill="#223544" stroke="#F7F5EE" stroke-opacity="0.10" stroke-width="1"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#89CFC2" fill-opacity="0.45"/>
    </g>

    <!-- SPACE 2 (Middle): Mirror Tall Layout -->
    <g transform="translate(684, 184)" filter="url(#cardShadowBackD)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#1B2C39" stroke="#F7F5EE" stroke-opacity="0.20" stroke-width="1.2"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#8EA5B4">02 · MIRROR</text>
      <!-- Top Master Pane -->
      <rect x="16" y="36" width="368" height="106" rx="13" fill="#2D4454" stroke="#F7F5EE" stroke-opacity="0.16" stroke-width="1"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#89CFC2" fill-opacity="0.72"/>
      <!-- Bottom Three Side-by-Side Stack Panes -->
      <rect x="16" y="154" width="115" height="90" rx="12" fill="#233745" stroke="#F7F5EE" stroke-opacity="0.12" stroke-width="1"/>
      <rect x="143" y="154" width="114" height="90" rx="12" fill="#213442" stroke="#F7F5EE" stroke-opacity="0.12" stroke-width="1"/>
      <rect x="269" y="154" width="115" height="90" rx="12" fill="#1F313E" stroke="#F7F5EE" stroke-opacity="0.12" stroke-width="1"/>
    </g>

    <!-- SPACE 1 (Front, Active): Tall Layout -->
    <g transform="translate(556, 296)" filter="url(#cardShadowFrontD)">
      <rect x="0" y="0" width="400" height="260" rx="22" fill="#1E3140" stroke="#F7F5EE" stroke-opacity="0.28" stroke-width="1.4"/>
      <circle cx="24" cy="20" r="3.5" fill="#D37859"/>
      <text x="36" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#E6EEF3">01 · TALL</text>
      <!-- Left Master Pane (Warm Parchment + Terracotta Focus Bar) -->
      <rect x="16" y="36" width="208" height="208" rx="13" fill="url(#masterD)"/>
      <rect x="34" y="54" width="46" height="8" rx="4" fill="#D37859"/>
      <!-- Right Top Stack Pane -->
      <rect x="236" y="36" width="148" height="98" rx="13" fill="url(#stackTopD)"/>
      <!-- Right Bottom Stack Pane -->
      <rect x="236" y="146" width="148" height="98" rx="13" fill="url(#stackBotD)"/>
    </g>
  </g>
</svg>
