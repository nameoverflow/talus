<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Talus — Tiling window manager for macOS.">
  <title>Talus — Tiling window manager for macOS.</title>
  <defs>
    <clipPath id="clipDark">
      <rect width="1280" height="640" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipDark)">
    <!-- Solid Flat Midnight Slate Canvas (Zero Gradients, Zero Shadows) -->
    <rect width="1280" height="640" fill="#101A22"/>

    <!-- Left: Quiet Typographic Anchor + Talus Status Bar Schematic -->
    <rect x="88" y="198" width="40" height="4.5" rx="2.25" fill="#D37859"/>
    <text x="86" y="302" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="94" font-weight="600" letter-spacing="-3.4" fill="#F5F3EC">Talus</text>
    <text x="90" y="352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="22" font-weight="400" letter-spacing="-0.2" fill="#90A4B2">Tiling window manager for macOS.</text>

    <!-- Flat Talus Menu-Bar Status Schematic -->
    <g transform="translate(88, 394)">
      <rect x="0" y="0" width="352" height="38" rx="9" fill="#172530" stroke="#2D4252" stroke-width="1.5"/>
      <!-- Mini Talus Status Mark -->
      <g transform="translate(13, 10.5)">
        <rect x="0" y="0" width="17" height="17" rx="3.5" fill="none" stroke="#DCE5EB" stroke-width="1.5"/>
        <rect x="2.8" y="2.8" width="5.8" height="11.4" rx="1.2" fill="#DCE5EB"/>
        <rect x="10.2" y="2.8" width="4" height="5" rx="0.9" fill="#DCE5EB"/>
        <rect x="10.2" y="9.2" width="4" height="5" rx="0.9" fill="#8EA5B4"/>
      </g>
      <!-- Active Workspace Pill (matches 01 · TALL) -->
      <rect x="42" y="7" width="66" height="24" rx="5.5" fill="#89CFC2"/>
      <text x="75" y="23" text-anchor="middle" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="12" font-weight="600" fill="#10201E">1 term</text>
      <text x="122" y="23" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="12" fill="#889DAC">2 web</text>
      <text x="174" y="23" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="12" fill="#889DAC">3 code</text>
      <line x1="234" y1="10" x2="234" y2="28" stroke="#2D4252" stroke-width="1.5"/>
      <text x="249" y="23" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="12" font-weight="600" fill="#D37859">Tall</text>
      <text x="338" y="23" text-anchor="end" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="12" fill="#9EB2BF">17:42</text>
    </g>

    <!-- Right: Three Flat Stacked Spaces (Tall · Mirror · Full) -->

    <!-- SPACE 3 (Back): Full Layout -->
    <g transform="translate(800, 72)">
      <rect x="0" y="0" width="400" height="260" rx="20" fill="#15222C" stroke="#293C4B" stroke-width="1.5"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#6F8696">03 · FULL</text>
      <rect x="16" y="36" width="368" height="208" rx="12" fill="#1E303D" stroke="#2D4353" stroke-width="1.2"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#5D8A85"/>
    </g>

    <!-- SPACE 2 (Middle): Mirror Layout -->
    <g transform="translate(684, 184)">
      <rect x="0" y="0" width="400" height="260" rx="20" fill="#182834" stroke="#334B5C" stroke-width="1.5"/>
      <text x="18" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" letter-spacing="0.8" fill="#8EA5B4">02 · MIRROR</text>
      <!-- Top Master Pane -->
      <rect x="16" y="36" width="368" height="106" rx="12" fill="#273D4C" stroke="#3A5568" stroke-width="1.2"/>
      <rect x="32" y="52" width="42" height="7" rx="3.5" fill="#89CFC2"/>
      <!-- Bottom Three Side-by-Side Stack Panes -->
      <rect x="16" y="154" width="115" height="90" rx="11" fill="#1F3240" stroke="#314859" stroke-width="1.2"/>
      <rect x="143" y="154" width="114" height="90" rx="11" fill="#1F3240" stroke="#314859" stroke-width="1.2"/>
      <rect x="269" y="154" width="115" height="90" rx="11" fill="#1D2F3C" stroke="#314859" stroke-width="1.2"/>
    </g>

    <!-- SPACE 1 (Front, Active): Tall Layout -->
    <g transform="translate(556, 296)">
      <rect x="0" y="0" width="400" height="260" rx="20" fill="#1C2E3C" stroke="#466378" stroke-width="1.6"/>
      <circle cx="24" cy="20" r="3.5" fill="#D37859"/>
      <text x="36" y="24" font-family="'SF Mono', ui-monospace, 'Menlo', monospace" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#F5F3EC">01 · TALL</text>
      <!-- Left Master Pane (Flat Warm Paper + Terracotta Focus Bar) -->
      <rect x="16" y="36" width="208" height="208" rx="12" fill="#F2EFE4"/>
      <rect x="34" y="54" width="46" height="8" rx="4" fill="#D37859"/>
      <!-- Right Top Stack Pane (Flat Mist Sage) -->
      <rect x="236" y="36" width="148" height="98" rx="12" fill="#DCE4DC"/>
      <!-- Right Bottom Stack Pane (Flat Soft Teal-Sage) -->
      <rect x="236" y="146" width="148" height="98" rx="12" fill="#BCD5CC"/>
    </g>
  </g>
</svg>
